services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plataformacpc-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    networks:
      - plataformacpc

  nginx:
    image: nginx:alpine
    container_name: plataformacpc-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - plataformacpc

  db:
    image: mysql:8.4
    container_name: plataformacpc-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: plataformaCPC
      MYSQL_USER: plataforma
      MYSQL_PASSWORD: plataforma_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - plataformacpc

  node:
    image: node:22-alpine
    container_name: plataformacpc-node
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DOCKER_ENV: "true"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - plataformacpc

volumes:
  mysql_data:
  vendor:
  node_modules:

networks:
  plataformacpc:
    driver: bridge